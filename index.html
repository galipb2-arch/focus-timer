<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uzay Domatesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="sky"></canvas>
  <div class="nebula"></div>
  <div class="vignette"></div>

  <div class="app">
    <header class="top-bar">
      <h1>Uzay Domatesi</h1>
      <div class="streak" id="streak">
        <span class="flame">🔥</span>
        <span id="streakCount">0</span>
        <span class="streak-label">day streak</span>
      </div>
    </header>

    <main class="timer-card" id="timerCard">
      <div class="mode-switch">
        <button class="mode-btn active" data-mode="focus">Focus</button>
        <button class="mode-btn" data-mode="short">Short Break</button>
        <button class="mode-btn" data-mode="long">Long Break</button>
      </div>

      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 220 220">
          <circle class="ring-bg" cx="110" cy="110" r="100"></circle>
          <circle class="ring-progress" id="ringProgress" cx="110" cy="110" r="100"></circle>
        </svg>
        <div class="time-display">
          <span id="timeLeft">25:00</span>
          <span class="active-task" id="activeTaskLabel">No task selected</span>
        </div>
      </div>

      <div class="controls">
        <button id="startPauseBtn" class="primary-btn">Start</button>
        <button id="resetBtn" class="secondary-btn">Reset</button>
        <button id="skipBtn" class="secondary-btn">Skip</button>
      </div>

      <div class="pomo-dots" id="pomoDots"></div>

      <div class="garden" id="garden">
        <svg viewBox="0 0 200 110" class="garden-svg">
          <ellipse class="soil" cx="100" cy="102" rx="58" ry="7"></ellipse>

          <g id="sprout" class="sprout">
            <path d="M100,102 q-5,-10 0,-17"></path>
            <path d="M100,102 q6,-8 0,-15"></path>
          </g>

          <rect id="stem" class="stem" x="99" y="42" width="2" height="60"></rect>

          <g id="leaf1" class="leaf leaf-left">
            <ellipse cx="-13" cy="-4" rx="15" ry="6"></ellipse>
          </g>
          <g id="leaf2" class="leaf leaf-right">
            <ellipse cx="13" cy="-4" rx="15" ry="6"></ellipse>
          </g>

          <g id="tomatoAnchor" class="tomato-anchor">
            <g id="tomatoGroup" class="tomato-group">
              <path class="calyx" d="M0,-9 l-4,-5 l4,2 l4,-2 z"></path>
              <circle id="tomato" class="tomato" cx="0" cy="0" r="9"></circle>
              <ellipse class="tomato-shine" cx="-3" cy="-3" rx="2.5" ry="1.6"></ellipse>
            </g>
          </g>
        </svg>
        <div class="garden-caption" id="gardenCaption">Tohum ekildi 🌱</div>
      </div>
    </main>

    <section class="tasks-card">
      <h2>Tasks</h2>
      <form id="taskForm" class="task-form">
        <input type="text" id="taskInput" placeholder="What are you focusing on?" autocomplete="off" maxlength="80">
        <button type="submit">Add</button>
      </form>
      <ul id="taskList" class="task-list"></ul>
    </section>
  </div>

  <div class="celebrate" id="celebrate"></div>

  <script src="sky.js"></script>
  <script src="app.js"></script>
</body>
</html>
